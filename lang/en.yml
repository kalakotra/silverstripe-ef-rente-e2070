en:
  'Kalakotra\EFormRenteE2070\Forms\Form':
    'SAVE_ERROR': 'There was a problem saving your data. Please try again.'
  'Kalakotra\EFormRenteE2070\Forms\Form_Preview':
    'AcceptNoReturn': 'I expressly agree that you begin performing the contract before the withdrawal period expires. I am aware that by giving this consent I lose my right of withdrawal once performance of the contract begins.'
    'AcceptTerms': 'I have read and accept the <a href="/de/agb" target="_blank">terms and conditions</a> and the <a href="/de/datenschutz" target="_blank">privacy policy</a>.'
    'ConfirmationEmail': 'Your e-mail address:'
    'SignatureRequired': 'Please sign the application.'
  'Kalakotra\EFormRenteE2070\Forms\Form_Step1':
    'BirthName': 'Birth name'
    'BirthNameDiffers': 'Does your birth name differ from your current name?'
    'BirthNameDiffers.no': 'no ("IDEM" will be entered in the form)'
    'BirthNameDiffers.yes': 'yes'
    'DEFAULT_SELECT': 'Please select'
    'FatherName': 'Father''s surname and first names (optional)'
    'FirstNames': 'First names'
    'FirstNamesDescription': 'All first names in the order of the civil registration'
    'FormerNames': 'Former names (optional)'
    'FormerNamesDescription': 'In particular in case of adoption or commonly used additional names'
    'Gender': 'Gender'
    'Gender.female': 'female (F)'
    'Gender.male': 'male (M)'
    'IntroNotice': 'With form E 207 (Particulars concerning the insured person''s career) you inform the pension insurance institution of all periods you have completed in Germany and in other EU or EEA states or in Switzerland. Item 6 is completed by the institution dealing with the claim.'
    'IntroText': 'Particulars concerning the insured person'
    'LastName': 'Surname'
    'LastNameDescription': 'Usual surname or the surname adopted on marriage'
    'MotherName': 'Mother''s birth name and first names (optional)'
    'ParentsHeader': 'Parents'
    'ParentsNotice': 'This information is required if you are a Spanish national or if the form is intended for a French institution.'
  'Kalakotra\EFormRenteE2070\Forms\Form_Step2':
    'AddressHeader': 'Address'
    'BirthCountry': 'Country of birth'
    'BirthCountryDescription': 'Preferably as country code (ISO 3166-1), e.g. DE, HR, BA, TR'
    'BirthDate': 'Date of birth'
    'BirthHeader': 'Birth'
    'BirthPlace': 'Place of birth'
    'BirthRegion': 'Province, department, district (optional)'
    'BirthRegionDescription': 'Mandatory for Spanish, French and Italian insured persons'
    'City': 'Place'
    'Country': 'Country'
    'ForeignIdNumber': 'Identification number (optional)'
    'ForeignIdNumberDescription': 'Depending on the foreign institution, e.g. PESEL (Poland), EMŠO (Slovenia), birth number (Czech Republic, Slovakia), AHV number (Switzerland)'
    'IntroText': 'Nationality, birth and address'
    'Nationality': 'Nationality'
    'NationalityDescription': 'e.g. German, Croatian, Bosnian'
    'NaturalizationDate': 'Date of naturalisation (optional)'
    'Phone': 'Telephone number (optional)'
    'PostalCode': 'Postcode'
    'Street': 'Street and house number / P.O. box'
  'Kalakotra\EFormRenteE2070\Forms\Form_Step3':
    'AuthorityNotice': 'Item 6 (institution dealing with the claim, stamp, date, signature) is completed by the pension insurance institution.'
    'ForeignInsuranceNumber': 'Insurance number with the foreign (other) institution (if known)'
    'InsuranceNumber': 'Insurance number of the German Pension Insurance (Deutsche Rentenversicherung) (if known)'
    'InsuranceNumberDescription': 'e.g. 12 150385 M 012 - entered under items 1.8 and 5.1'
    'IntroText': 'Insurance numbers'
    'Kennzeichen': 'Identifier (if known)'
  'Kalakotra\EFormRenteE2070\Forms\PeriodStepTrait':
    'Activity': 'Activity / occupation / type of education or training'
    'ActivityDescription': 'e.g. fitter, sales assistant, farmer, apprenticeship as electrician; for military service: country'
    'CheckEntries': 'Please check the marked entries.'
    'DEFAULT_SELECT': 'Please select'
    'Employer': 'Name and registered office of the employer / training institution or type of self-employed activity'
    'From': 'From'
    'InsuranceHeader': 'Insurance during this period'
    'InsuranceNumber': 'Insurance number (optional)'
    'InsuranceType': 'Type of insurance'
    'InsuranceType.continued': 'voluntary continued insurance'
    'InsuranceType.mandatory': 'compulsory insurance'
    'InsuranceType.none': 'period without insurance'
    'InsuranceType.voluntary': 'voluntary insurance'
