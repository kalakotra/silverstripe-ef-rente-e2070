    'Type.employee': 'Employment as an employee'
    'Type.household': 'Running a household / raising children'
    'Type.military': 'Military service / civilian service'
    'Type.other': 'Other period'
    'Type.residence': 'Residence without gainful activity'
    'Type.self_employed': 'Self-employed activity'
    'Type.sickness': 'Sickness'
    'Type.training': 'School or vocational training'
    'Type.unemployed': 'Unemployment'
    'Workplace': 'Place and country of activity'
    'WorkplaceDescription': 'For France please also state the département'
  'Kalakotra\EFormRenteE2070\Forms\StepTrait':
    'REQUIRED': '"{name}" is required.'
    'REQUIRED_SUMMARY': 'Please fill in the following required fields: {fields}'
